name: Website publiceren

on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Eerst de controles; faalt er een, dan gaat de website niet online
  check:
    uses: ./.github/workflows/checks.yml

  # Bouwen en publiceren in twee jobs (zoals het sjabloon van GitHub): in één job zocht de publicatie het
  # zojuist geüploade pakket soms al op voordat GitHub het kende ("Found 0 artifact(s)").
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Gepubliceerd wordt een verkleinde kopie van docs/ (één script in plaats van tientallen, zie tools/bouw-site.mjs)
      - name: Site bouwen
        run: |
          npm i --no-save --no-audit --no-fund esbuild@0.28.2
          node tools/bouw-site.mjs --uit _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
