name: Controles

# Bij elke push en pull request: syntaxis en namen van de website, typecontrole (geen nieuwe typefouten),
# de Worker-tests met nep-API's en de meegeleverde bibliotheek (vingerafdruk en bekende kwetsbaarheden).
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Website
        run: node tools/check-site.mjs
      - name: Types (TypeScript checkJs, geen nieuwe meldingen)
        run: node tools/check-types.mjs
      - name: Worker
        run: node worker/test/run.mjs
      - name: Meegeleverde bibliotheek (docs/vendor)
        run: node tools/check-vendor.mjs
