name: Controles

# Bij elke push en pull request: syntaxis en namen van de website, de toonschatting van nieuwsberichten,
# typecontrole (geen nieuwe typefouten), de Worker-tests met nep-API's, de meegeleverde bibliotheek
# (vingerafdruk en bekende kwetsbaarheden) en de contracttests van de bronnen. Daarnaast draait de site in een
# echte browser met voorbeeldgegevens: elke pagina openen, het rekenwerk en de opmaak nameten.
# De publicatie van de website wacht op deze werkstroom (zie pages.yml).
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # De hele geschiedenis: tools/check-stijl.mjs vergelijkt met main en heeft daarvoor
          # een gemeenschappelijke voorouder nodig (met een ondiepe kloon is die er niet).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Website
        run: node tools/check-site.mjs
      - name: Toon van nieuwsberichten
        run: node tools/check-toon.mjs
      - name: Types (TypeScript checkJs, geen nieuwe meldingen)
        run: node tools/check-types.mjs
      - name: Worker
        run: node worker/test/run.mjs
      - name: Meegeleverde bibliotheek (docs/vendor)
        run: node tools/check-vendor.mjs
      - name: Bronnen (contracttests met bewaarde voorbeeldantwoorden)
        run: node worker/test/contract.mjs
      - name: Ongebruikte code (alleen ter informatie)
        run: node tools/check-dood.mjs --worker
      - name: Vertalingen (waarschuwing, blokkeert niet)
        run: node tools/check-i18n.mjs
      - name: CSS van gewijzigde regels
        run: |
          npm i --no-save --no-audit --no-fund stylelint@16
          node tools/check-stijl.mjs

  browser:
    # Vaste Ubuntu-versie: Playwright ondersteunt alleen bepaalde versies met --with-deps, en een
    # vaste versie houdt ook de schermafbeeldingen (lettertypen) tussen metingen gelijk.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Playwright installeren
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.65.1
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Voorbeeldgegevens (geen lege tegels, geen NaN)
        run: node tools/check-demo.mjs
      - name: Alle pagina's openen (fouten in de console, overloop)
        run: node tools/smoke.mjs
      - name: Rekenwerk en opmaak
        run: node tools/test-reken.mjs
