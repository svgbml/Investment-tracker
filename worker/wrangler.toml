name = "investment-tracker"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Elke 10 minuten (UTC). De Worker meet op werkdagen de hele dag; buiten 08:00–22:30 haalt hij daarnaast orders en marktgegevens op.
[triggers]
crons = ["*/10 * * * *", "17 5 * * *"]
# De tweede (05:17 UTC) haalt 1x per dag dividenden en kwartaalcijfers op.

[[d1_databases]]
binding = "DB"
database_name = "investment-tracker"
database_id = "fa2a3bfc-427c-4ee5-98a8-7f1737575f09"

[observability]
enabled = true

[vars]
T212_BASE = "https://live.trading212.com"
ALLOWED_ORIGIN = "https://svgbml.github.io"

# Geheimen (niet in dit bestand!), instellen met:
#   npx wrangler secret put T212_KEY
#   npx wrangler secret put T212_SECRET
#   npx wrangler secret put WEB_TOKEN
#   npx wrangler secret put FMP_KEY   (optioneel: aankomende kwartaalcijfers en dividenden)

# Tests (nep-API's en een database in het geheugen) draaien vóór elke deploy; faalt er een, dan gaat de deploy niet door.
# Zonder node:sqlite (Node ouder dan 22.13) worden ze overgeslagen.
[build]
command = "node test/run.mjs && node test/contract.mjs"
